spring:
  datasource:
    url: jdbc:h2:mem:utsav-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration

utsav:
  jwt-secret: test-secret-key-for-tests-only-min-32-chars-long
  stripe:
    enabled: false
  concierge:
    enabled: false
